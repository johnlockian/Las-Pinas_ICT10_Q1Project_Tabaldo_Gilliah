<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKU Generator</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }

    .brand {
      font-size: 24px;
      font-weight: bold;
    }

    nav a {
      text-decoration: none;
      color: #333;
      margin-left: 10px;
    }

    .box {
      background: white;
      border: 1px solid #ddd;
      padding: 20px;
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
    }

    button {
      background: #1d4ed8;
      color: white;
      border: none;
      padding: 10px 14px;
      cursor: pointer;
    }

    .output {
      margin-top: 20px;
      background: #eef5ff;
      border: 1px solid #cfe0ff;
      padding: 15px;
      font-weight: bold;
      word-break: break-all;
    }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">Final Project</div>
      <nav> # navbar so its easier to get to each link.
        <a href="index.html">Home</a>
        <a href="sku-generator.html">SKU</a>
        <a href="receipt-generator.html">Receipt</a>
      </nav>
    </div>

    <div class="box">
      <h1>SKU Generator</h1>

      <form id="skuForm" py-submit="SKU_generator" onsubmit="return false;">
        <label for="category">Category</label> # lets you choose the type of category
        <select id="category">
          <option value="EL">Electronics</option>
          <option value="CL">Clothes</option>
          <option value="HM">Home</option>
          <option value="GR">Grocery</option>
          <option value="OT">Other</option>
        </select>

        <label for="product_name">Product name</label> # insert product name (any) here
        <input id="product_name" type="text" placeholder="Example: Coffee Mug" required>

        <label for="quantity">Quantity</label> # put the number of the product here
        <input id="quantity" type="number" min="1" value="10" required>

        <button type="button" py-click="SKU_generator">Generate</button>
      </form>

      <div class="output" id="sku_output">SKU will show here</div> # sku will be generated here
    </div>
  </div>

  <script type="py" src="main.py"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
